<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>売価計算</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 16px; max-width: 480px; margin: 0 auto; }
h1 { font-size: 18px; font-weight: 500; margin-bottom: 20px; color: #333; }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tab { flex: 1; padding: 10px 4px; font-size: 13px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; color: #666; }
.tab.active { border-color: #333; color: #333; font-weight: 500; }
.card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; }
input[type=number] { width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
input[type=number]:focus { border-color: #333; }
.formatted { font-size: 12px; color: #999; margin-top: 3px; min-height: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.slider-row { display: flex; align-items: center; gap: 12px; }
input[type=range] { flex: 1; }
.slider-val { font-size: 14px; font-weight: 500; min-width: 36px; }
.results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.result-item { background: #f5f5f5; border-radius: 8px; padding: 12px; text-align: center; }
.result-item.highlight { background: #e8f0fe; }
.result-item.green { background: #e8f5e9; }
.result-label { font-size: 11px; color: #888; margin-bottom: 4px; }
.result-value { font-size: 20px; font-weight: 500; color: #333; }
.result-item.highlight .result-value { color: #1a73e8; }
.result-item.green .result-value { color: #2e7d32; }
</style>
</head>
<body>
<h1>売価計算ツール</h1>

<div class="tabs">
  <button class="tab active" id="btn1" onclick="setMode(1)">定価＋掛率</button>
  <button class="tab" id="btn2" onclick="setMode(2)">定価＋仕入値</button>
  <button class="tab" id="btn3" onclick="setMode(3)">オープン価格</button>
</div>

<div class="card">
  <div id="mode1" class="grid2">
    <div>
      <label>定価（円）</label>
      <input type="number" id="teika1" placeholder="10000" oninput="showFmt('teika1','fmt_t1'); calc()">
      <div class="formatted" id="fmt_t1"></div>
    </div>
    <div>
      <label>仕入掛率（%）</label>
      <input type="number" id="shiire_rate1" placeholder="60" oninput="calc()">
      <div class="formatted"></div>
    </div>
  </div>
  <div id="mode2" style="display:none" class="grid2">
    <div>
      <label>定価（円）</label>
      <input type="number" id="teika2" placeholder="10000" oninput="showFmt('teika2','fmt_t2'); calc()">
      <div class="formatted" id="fmt_t2"></div>
    </div>
    <div>
      <label>仕入値（円）</label>
      <input type="number" id="shiire_direct2" placeholder="6000" oninput="showFmt('shiire_direct2','fmt_s2'); calc()">
      <div class="formatted" id="fmt_s2"></div>
    </div>
  </div>
  <div id="mode3" style="display:none">
    <label>仕入値（円）</label>
    <input type="number" id="shiire_direct3" placeholder="6000" oninput="showFmt('shiire_direct3','fmt_s3'); calc()">
    <div class="formatted" id="fmt_s3"></div>
  </div>

  <div style="margin-top:16px">
    <label>目標利益率（%）</label>
    <div class="slider-row">
      <input type="range" min="5" max="30" value="10" step="1" id="profit_rate"
        oninput="document.getElementById('profit_out').textContent=this.value+'%'; calc()">
      <span class="slider-val" id="profit_out">10%</span>
    </div>
  </div>
</div>

<div class="card">
  <div class="results">
    <div class="result-item">
      <div class="result-label">仕入値</div>
      <div class="result-value" id="shiire_price">—</div>
    </div>
    <div class="result-item highlight">
      <div class="result-label">売価（税別）</div>
      <div class="result-value" id="baika">—</div>
    </div>
    <div class="result-item">
      <div class="result-label">仕入掛率</div>
      <div class="result-value" id="shiire_kakuritsu">—</div>
    </div>
    <div class="result-item">
      <div class="result-label">売上掛率</div>
      <div class="result-value" id="sell_rate">—</div>
    </div>
    <div class="result-item green" style="grid-column: span 2;">
      <div class="result-label">利益額</div>
      <div class="result-value" id="profit_amt">—</div>
    </div>
  </div>
</div>

<script>
var currentMode = 1;

function showFmt(inputId, fmtId) {
  var v = parseFloat(document.getElementById(inputId).value);
  var el = document.getElementById(fmtId);
  if (!isNaN(v) && v > 0) {
    el.textContent = '→ ' + Math.round(v).toLocaleString('ja-JP') + '円';
  } else {
    el.textContent = '';
  }
}

function setMode(m) {
  currentMode = m;
  document.getElementById('mode1').style.display = m===1 ? 'grid' : 'none';
  document.getElementById('mode2').style.display = m===2 ? 'grid' : 'none';
  document.getElementById('mode3').style.display = m===3 ? 'block' : 'none';
  ['btn1','btn2','btn3'].forEach(function(id,i){
    document.getElementById(id).className = 'tab' + (i+1===m ? ' active' : '');
  });
  reset();
}

function fmt(n) {
  return Math.round(n).toLocaleString('ja-JP') + '円';
}

function calc() {
  var profitRate = parseFloat(document.getElementById('profit_rate').value) / 100;
  var shiireVal, teika, baika, sellRate, profitAmt, shiireKakuritsu;

  if (currentMode === 1) {
    teika = parseFloat(document.getElementById('teika1').value);
    var rate = parseFloat(document.getElementById('shiire_rate1').value);
    if (isNaN(teika) || isNaN(rate)) return reset();
    shiireVal = teika * (rate / 100);
    baika = shiireVal / (1 - profitRate);
    shiireKakuritsu = Math.round(rate) + '%';
    sellRate = Math.round((baika / teika) * 100) + '%';
  } else if (currentMode === 2) {
    teika = parseFloat(document.getElementById('teika2').value);
    shiireVal = parseFloat(document.getElementById('shiire_direct2').value);
    if (isNaN(teika) || isNaN(shiireVal) || teika <= 0) return reset();
    baika = shiireVal / (1 - profitRate);
    shiireKakuritsu = Math.round((shiireVal / teika) * 100) + '%';
    sellRate = Math.round((baika / teika) * 100) + '%';
  } else {
    shiireVal = parseFloat(document.getElementById('shiire_direct3').value);
    if (isNaN(shiireVal)) return reset();
    baika = shiireVal / (1 - profitRate);
    shiireKakuritsu = '—';
    sellRate = '—';
  }

  profitAmt = baika - shiireVal;
  document.getElementById('shiire_price').textContent = fmt(shiireVal);
  document.getElementById('baika').textContent = fmt(baika);
  document.getElementById('shiire_kakuritsu').textContent = shiireKakuritsu;
  document.getElementById('sell_rate').textContent = sellRate;
  document.getElementById('profit_amt').textContent = fmt(profitAmt);
}

function reset() {
  ['shiire_price','baika','shiire_kakuritsu','sell_rate','profit_amt'].forEach(function(id){
    document.getElementById(id).textContent = '—';
  });
}
</script>
</body>
</html>
