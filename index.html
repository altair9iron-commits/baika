<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>売価計算</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 16px; max-width: 480px; margin: 0 auto; }
h1 { font-size: 18px; font-weight: 500; margin-bottom: 20px; color: #333; }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tab { flex: 1; padding: 12px 4px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; color: #666; }
.tab.active { border-color: #333; color: #333; font-weight: 500; background: #f0f0f0; }
.card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.section-title { font-size: 12px; color: #999; font-weight: 500; margin-bottom: 10px; letter-spacing: 0.05em; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.field { }
label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; }
input[type=number] { width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
input[type=number]:focus { border-color: #555; }
.fmt { font-size: 11px; color: #aaa; margin-top: 3px; min-height: 15px; }
.divider { border: none; border-top: 1px solid #eee; margin: 16px 0; }
.results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ri { background: #f5f5f5; border-radius: 8px; padding: 12px; text-align: center; }
.ri.blue { background: #e8f0fe; }
.ri.green { background: #e8f5e9; }
.ri.wide { grid-column: span 2; }
.rl { font-size: 11px; color: #888; margin-bottom: 4px; }
.rv { font-size: 22px; font-weight: 500; color: #333; }
.ri.blue .rv { color: #1a73e8; }
.ri.green .rv { color: #2e7d32; }
</style>
</head>
<body>
<h1>売価計算ツール</h1>

<div class="tabs">
  <button class="tab active" id="btn1" onclick="setMode(1)">定価あり</button>
  <button class="tab" id="btn2" onclick="setMode(2)">オープン価格</button>
</div>

<!-- モード1 -->
<div id="mode1">
  <div class="card">
    <div class="section-title">定価</div>
    <input type="number" id="teika" placeholder="32200" oninput="showFmt('teika','fmt_teika'); syncShiire('rt'); syncBaika('rt'); calc1()">
    <div class="fmt" id="fmt_teika"></div>

    <hr class="divider">

    <div class="section-title">仕入れ　どちらか入力</div>
    <div class="row2">
      <div class="field">
        <label>仕入掛率（%）</label>
        <input type="number" id="s_rt" placeholder="48" oninput="syncShiire('rt'); calc1()">
        <div class="fmt" id="fmt_srt"></div>
      </div>
      <div class="field">
        <label>仕入値（円）</label>
        <input type="number" id="s_val" placeholder="15456" oninput="syncShiire('val'); calc1()">
        <div class="fmt" id="fmt_sval"></div>
      </div>
    </div>

    <div class="section-title">売上　どちらか入力</div>
    <div class="row2">
      <div class="field">
        <label>売上掛率（%）</label>
        <input type="number" id="b_rt" placeholder="55" oninput="syncBaika('rt'); calc1()">
        <div class="fmt" id="fmt_brt"></div>
      </div>
      <div class="field">
        <label>売価（円）</label>
        <input type="number" id="b_val" placeholder="17710" oninput="syncBaika('val'); calc1()">
        <div class="fmt" id="fmt_bval"></div>
      </div>
    </div>
  </div>
</div>

<!-- モード2 -->
<div id="mode2" style="display:none">
  <div class="card">
    <div class="field" style="margin-bottom:16px">
      <label>仕入値（円）</label>
      <input type="number" id="op_shiire" placeholder="6000" oninput="showFmt('op_shiire','fmt_ops'); calc2()">
      <div class="fmt" id="fmt_ops"></div>
    </div>
    <div class="field">
      <label>売価（円）</label>
      <input type="number" id="op_baika" placeholder="7000" oninput="showFmt('op_baika','fmt_opb'); calc2()">
      <div class="fmt" id="fmt_opb"></div>
    </div>
  </div>
</div>

<!-- 結果 -->
<div class="card">
  <div class="results">
    <div class="ri">
      <div class="rl">仕入値</div>
      <div class="rv" id="r_s">—</div>
    </div>
    <div class="ri blue">
      <div class="rl">売価（税別）</div>
      <div class="rv" id="r_b">—</div>
    </div>
    <div class="ri">
      <div class="rl">仕入掛率</div>
      <div class="rv" id="r_srt">—</div>
    </div>
    <div class="ri">
      <div class="rl">売上掛率</div>
      <div class="rv" id="r_brt">—</div>
    </div>
    <div class="ri green wide">
      <div class="rl">粗利率　／　利益額</div>
      <div class="rv" id="r_profit">—</div>
    </div>
  </div>
</div>

<script>
var mode = 1;
var syncingS = false, syncingB = false;

function showFmt(id, fid) {
  var v = parseFloat(document.getElementById(id).value);
  document.getElementById(fid).textContent = (!isNaN(v) && v > 0)
    ? '→ ' + Math.round(v).toLocaleString('ja-JP') + '円' : '';
}

function syncShiire(from) {
  if (syncingS) return;
  syncingS = true;
  var teika = parseFloat(document.getElementById('teika').value);
  if (!isNaN(teika) && teika > 0) {
    if (from === 'rt') {
      var rt = parseFloat(document.getElementById('s_rt').value);
      if (!isNaN(rt)) {
        var val = Math.round(teika * rt / 100);
        document.getElementById('s_val').value = val;
        document.getElementById('fmt_sval').textContent = '→ ' + val.toLocaleString('ja-JP') + '円';
      }
    } else {
      var val2 = parseFloat(document.getElementById('s_val').value);
      if (!isNaN(val2)) {
        var rt2 = (val2 / teika * 100).toFixed(1);
        document.getElementById('s_rt').value = rt2;
        showFmt('s_val','fmt_sval');
      }
    }
  }
  syncingS = false;
}

function syncBaika(from) {
  if (syncingB) return;
  syncingB = true;
  var teika = parseFloat(document.getElementById('teika').value);
  if (!isNaN(teika) && teika > 0) {
    if (from === 'rt') {
      var rt = parseFloat(document.getElementById('b_rt').value);
      if (!isNaN(rt)) {
        var val = Math.round(teika * rt / 100);
        document.getElementById('b_val').value = val;
        document.getElementById('fmt_bval').textContent = '→ ' + val.toLocaleString('ja-JP') + '円';
      }
    } else {
      var val2 = parseFloat(document.getElementById('b_val').value);
      if (!isNaN(val2)) {
        var rt2 = (val2 / teika * 100).toFixed(1);
        document.getElementById('b_rt').value = rt2;
        showFmt('b_val','fmt_bval');
      }
    }
  }
  syncingB = false;
}

function calc1() {
  var teika = parseFloat(document.getElementById('teika').value);
  var srt = parseFloat(document.getElementById('s_rt').value);
  var brt = parseFloat(document.getElementById('b_rt').value);
  var sval = parseFloat(document.getElementById('s_val').value);
  var bval = parseFloat(document.getElementById('b_val').value);

  var shiire = !isNaN(sval) ? sval : (!isNaN(srt) && !isNaN(teika) ? teika * srt / 100 : null);
  var baika  = !isNaN(bval) ? bval : (!isNaN(brt) && !isNaN(teika) ? teika * brt / 100 : null);
  var shiireRt = !isNaN(srt) ? parseFloat(srt).toFixed(1) + '%' : (shiire !== null && !isNaN(teika) && teika > 0 ? (shiire/teika*100).toFixed(1) + '%' : '—');
  var baikaRt  = !isNaN(brt) ? parseFloat(brt).toFixed(1) + '%' : (baika !== null && !isNaN(teika) && teika > 0 ? (baika/teika*100).toFixed(1) + '%' : '—');

  setResults(shiire, baika, shiireRt, baikaRt);
}

function calc2() {
  var s = parseFloat(document.getElementById('op_shiire').value);
  var b = parseFloat(document.getElementById('op_baika').value);
  if (isNaN(s) || isNaN(b)) return reset();
  setResults(s, b, '—', '—');
}

function setResults(shiire, baika, srt, brt) {
  var profit = (shiire !== null && baika !== null) ? baika - shiire : null;
  var prate  = (profit !== null && baika > 0) ? (profit / baika * 100) : null;

  document.getElementById('r_s').textContent    = shiire !== null ? fmt(shiire) : '—';
  document.getElementById('r_b').textContent    = baika  !== null ? fmt(baika)  : '—';
  document.getElementById('r_srt').textContent  = srt;
  document.getElementById('r_brt').textContent  = brt;
  document.getElementById('r_profit').textContent = (prate !== null && profit !== null)
    ? prate.toFixed(1) + '%　／　' + fmt(profit) : '—';
}

function fmt(n) { return Math.round(n).toLocaleString('ja-JP') + '円'; }

function reset() {
  ['r_s','r_b','r_srt','r_brt','r_profit'].forEach(function(id){
    document.getElementById(id).textContent = '—';
  });
}

function setMode(m) {
  mode = m;
  document.getElementById('mode1').style.display = m===1 ? 'block' : 'none';
  document.getElementById('mode2').style.display = m===2 ? 'block' : 'none';
  document.getElementById('btn1').className = 'tab' + (m===1 ? ' active' : '');
  document.getElementById('btn2').className = 'tab' + (m===2 ? ' active' : '');
  reset();
}
</script>
</body>
</html>
